name: Meta 토큰 만료 알림

on:
  schedule:
    - cron: "0 0 7 7 *"  # 매년 7월 7일 오전 9시 KST (0:00 UTC)

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notion 알림 페이지 생성
        run: |
          python3 - <<'PYEOF'
          import requests, json, datetime

          NOTION_TOKEN  = "${{ secrets.NOTION_TOKEN }}"
          NOTION_PARENT = "12fb99f5082080e5a78ac8591f0fbae4"

          today = datetime.date.today().strftime("%Y-%m-%d")

          page = {
            "parent": {"database_id": NOTION_PARENT},
            "icon": {"type": "emoji", "emoji": "⚠️"},
            "properties": {
              "이름": {
                "title": [{"text": {"content": f"[긴급] Meta 광고 토큰 내일 만료 — 지금 갱신 필요 ({today})"}}]
              }
            },
            "children": [
              {
                "object": "block",
                "type": "callout",
                "callout": {
                  "rich_text": [{"type": "text", "text": {"content": "⚠️ Meta 광고 액세스 토큰이 내일(7월 8일) 만료됩니다.\n지금 바로 갱신하지 않으면 내일부터 광고 보고서가 중단됩니다!"}}],
                  "icon": {"type": "emoji", "emoji": "🔑"},
                  "color": "red_background"
                }
              },
              {
                "object": "block",
                "type": "heading_2",
                "heading_2": {"rich_text": [{"type": "text", "text": {"content": "갱신 방법"}}]}
              },
              {
                "object": "block",
                "type": "numbered_list_item",
                "numbered_list_item": {"rich_text": [{"type": "text", "text": {"content": "developers.facebook.com/tools/explorer 접속"}}]}
              },
              {
                "object": "block",
                "type": "numbered_list_item",
                "numbered_list_item": {"rich_text": [{"type": "text", "text": {"content": "단기 토큰 생성 (Generate Access Token)"}}]}
              },
              {
                "object": "block",
                "type": "numbered_list_item",
                "numbered_list_item": {"rich_text": [{"type": "text", "text": {"content": "developers.facebook.com/tools/debug/accesstoken 에서 60일 장기 토큰으로 확장"}}]}
              },
              {
                "object": "block",
                "type": "numbered_list_item",
                "numbered_list_item": {"rich_text": [{"type": "text", "text": {"content": "터미널에서: gh secret set META_ACCESS_TOKEN --repo heegune55/ads_report"}}]}
              }
            ]
          }

          resp = requests.post(
            "https://api.notion.com/v1/pages",
            headers={
              "Authorization": f"Bearer {NOTION_TOKEN}",
              "Notion-Version": "2022-06-28",
              "Content-Type": "application/json"
            },
            json=page
          )

          if resp.status_code == 200:
            print("✅ Notion 알림 페이지 생성 완료")
          else:
            print(f"❌ 실패: {resp.status_code} {resp.text}")
            raise SystemExit(1)
          PYEOF
