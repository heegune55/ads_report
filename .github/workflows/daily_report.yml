name: 광고 소재 성과 보고서

on:
  schedule:
    - cron: "0 1 * * *"   # 매일 오전 10시 KST (1am UTC)
  workflow_dispatch:
    inputs:
      type:
        description: '보고서 유형'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - weekly
          - both
          - sixmonth
          - printnames
          - archbalance
          - liveanalysis
          - promo
          - retro
          - kpt
          - productreport
      account:
        description: '광고 계정'
        required: false
        default: 'KB계정'
        type: choice
        options:
          - KB계정
          - Baruner3계정
      date:
        description: '분석 날짜 (YYYY-MM-DD, 비우면 어제)'
        required: false
        default: ''
      person:
        description: '소재 이니셜 필터 (기본: KB)'
        required: false
        default: 'KB'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install requests

      - name: 계정 ID 설정
        id: account
        run: |
          if [ "${{ inputs.account }}" = "Baruner3계정" ]; then
            echo "META_ACCOUNT=act_607986688972375" >> $GITHUB_ENV
          else
            echo "META_ACCOUNT=act_3431020723842735" >> $GITHUB_ENV
          fi

      - name: 일간 보고서 생성
        if: ${{ github.event_name == 'schedule' || inputs.type == 'daily' || inputs.type == 'both' }}
        run: python report.py
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PERSON_FILTER: ${{ inputs.person || 'KB' }}
          TARGET_DATE: ${{ inputs.date || '' }}
          META_ACCOUNT: ${{ env.META_ACCOUNT }}

      - name: 위클리 보고서 생성
        if: ${{ github.event_name == 'schedule' || inputs.type == 'weekly' || inputs.type == 'both' }}
        run: python weekly_report.py
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PERSON_FILTER: ${{ inputs.person || 'KB' }}
          META_ACCOUNT: ${{ env.META_ACCOUNT }}

      - name: 6개월 소재 분석
        if: ${{ inputs.type == 'sixmonth' }}
        run: python six_month_report.py
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          META_ACCOUNT: ${{ env.META_ACCOUNT }}

      - name: 소재명 출력
        if: ${{ inputs.type == 'printnames' }}
        run: python print_names.py
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_ACCOUNT: ${{ env.META_ACCOUNT }}

      - name: 아치밸런스 소재 분석
        if: ${{ inputs.type == 'archbalance' }}
        run: python arch_balance_report.py
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          META_ACCOUNT: ${{ env.META_ACCOUNT }}

      - name: 월말 회고
        if: ${{ inputs.type == 'retro' }}
        run: python monthly_retro.py
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          META_ACCOUNT: ${{ env.META_ACCOUNT }}
          PERSON_FILTER: ${{ inputs.person || 'KB' }}
          RETRO_SINCE: ${{ inputs.date || '2026-05-01' }}

      - name: 프로모션 소재 분석
        if: ${{ inputs.type == 'promo' }}
        run: python promo_report.py
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          META_ACCOUNT: ${{ env.META_ACCOUNT }}

      - name: 라이브 소재 분석 (5/1~5/20)
        if: ${{ inputs.type == 'liveanalysis' }}
        run: python live_ad_analysis.py
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          META_ACCOUNT: ${{ env.META_ACCOUNT }}

      - name: KPT 회고 업로드
        if: ${{ inputs.type == 'kpt' }}
        run: python kpt_retro.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

      - name: 제품별 전체 성과 보고서
        if: ${{ inputs.type == 'productreport' }}
        run: python product_report.py
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          META_ACCOUNT: ${{ env.META_ACCOUNT }}
          PERSON_FILTER: ${{ inputs.person || 'KB' }}
          REPORT_SINCE: ${{ inputs.date || '2026-05-01' }}
          REPORT_UNTIL: "2026-05-27"
